<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharaoh's Labyrinth</title>
<style>
:root{--bg:#efe9df;--card:#fff8ec;--text:#2a1f14;--muted:#7a6a58;--line:#d8c9b2;--field:#f3e9d6;--accent:#c2691a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--card:#241c14;--text:#f2e6d2;--muted:#a69580;--line:#3d3123;--field:#30261b;--accent:#f0993a}}
:root[data-theme="dark"]{--bg:#17120d;--card:#241c14;--text:#f2e6d2;--muted:#a69580;--line:#3d3123;--field:#30261b;--accent:#f0993a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px 10px}
.wrap{width:100%;max-width:640px}
h1{text-align:center;margin:0 0 12px;font-size:1.6rem;letter-spacing:-.3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{flex:1;min-width:110px;display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
input[type=number],input[type=text]{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
select{font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
.err{color:#d9480f;font-weight:600;min-height:1.1em}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:9px;padding:9px 14px;background:var(--field);color:var(--text)}
button.primary{background:var(--accent);color:#fff}
.hint{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.hud{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:8px;font-size:.95rem;flex-wrap:wrap}
.hud span{color:var(--muted);font-weight:500}
#stage{position:relative;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000;border:2px solid var(--line)}
canvas{display:block;width:100%;height:100%}
#win{position:absolute;inset:0;background:rgba(10,6,2,.78);color:#f6e7c8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
#win.show{display:flex}
#win h2{margin:0;font-size:1.6rem}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;margin-top:12px;touch-action:none;user-select:none}
.pad button{padding:0;font-size:1.3rem;touch-action:none}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
#quiz{position:absolute;inset:0;background:rgba(10,6,2,.88);color:#f6e7c8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px}
#quiz.show{display:flex}
#quiz h3{margin:0;font-size:1.2rem}
#qBarWrap{width:100%;height:8px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
#qBar{height:100%;width:100%;background:#ffd65a}
#qOpts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
#qOpts button{padding:12px 8px}
#qOpts button.ok{background:#2f9e44;color:#fff}#qOpts button.bad{background:#c92a2a;color:#fff}
.seg{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.shop button:disabled{opacity:.45;cursor:not-allowed}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏺 Pharaoh's Labyrinth</h1>

  <div class="card">
    <div class="row">
      <label class="field">Level
        <select id="level">
          <option value="easy">Easy</option><option value="medium" selected>Medium</option>
          <option value="hard">Hard</option><option value="challenge">Challenge</option>
        </select></label>
      <label class="field"><span id="nLbl">Map size N (N×N rooms)</span><input id="n" type="number" min="10" max="40" value="14"></label>
      <label class="field">Seed (5 digits)<input id="seed" type="number" min="10000" max="99999" step="1" inputmode="numeric" value="48213"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="gen">Generate maze</button>
      <button id="rnd">🎲 Random seed</button>
      <button id="route">Show route</button>
      <label class="chk"><input type="checkbox" id="dim" checked> Torchlight</label>
    </div>
    <p class="hint" id="info"></p>
    <p class="hint err" id="err"></p>
  </div>

  <div class="hud"><div><span>Moves left</span> <b id="moves">0</b></div><div><span>Time</span> <b id="time">0:00</b></div><div><span>Seed</span> <b id="seedShow"></b></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="quiz"><div id="qInfo"></div><div id="qBarWrap"><div id="qBar"></div></div><h3 id="qText"></h3><div id="qOpts"></div></div>
    <div id="win"><h2>🏆 You escaped!</h2><div id="winTxt"></div><div class="row"><button class="primary" id="again">New random maze</button><button id="replay">Replay this maze</button></div></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="row">
      <button class="primary" id="qBtn">❓ Answer question</button>
      <div class="seg" id="risk">Risk:<button data-r="1" class="on">Off</button><button data-r="2">×2</button><button data-r="4">×4</button></div>
    </div>
    <div class="row shop" style="margin-top:10px">
      <button id="bWall"></button><button id="bTele"></button>
      <button id="bC10"></button><button id="bC20"></button><button id="bC30"></button>
    </div>
    <p class="hint" id="stat2"></p>
    <p class="hint" id="status">Every step costs 1 move. Correct answers earn moves.</p>
  </div>
  <div class="pad">
    <button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button><button class="d" data-d="down">▼</button><button class="r" data-d="right">▶</button>
  </div>
  <p class="hint" style="text-align:center">Arrow keys / WASD move one tile (1 move). Out of moves? Answer a question. Find the gold exit.</p>
</div>

// ---------- Seeded random + maze generation ----------
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return ()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function mulberry32(a){return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// Levels: own minimum N and branching. p = chance to grow from a random cell instead of the newest one.
// p≈0 -> long winding corridors, few branches; p=1 -> many short branches and dead ends.
const LEVELS = {
  easy:      {name:'Easy',      min:5,  def:8,  p:0.05},
  medium:    {name:'Medium',    min:10, def:14, p:0.35},
  hard:      {name:'Hard',      min:15, def:20, p:0.70},
  challenge: {name:'Challenge', min:20, def:28, p:1.00}
};

// Perfect maze (growing-tree): still exactly one route between any two cells.
// n×n rooms -> (2n+1)×(2n+1) tiles; g[y][x] = 1 wall, 0 floor.
function generate(n, seed, level){
  const S = 2*n+1, g = Array.from({length:S},()=>Array(S).fill(1)), p = LEVELS[level].p;
  const rnd = mulberry32(xmur3(seed+'|'+n+'|'+level)());
  const list = [[0,0]]; g[1][1] = 0;
  const D = [[1,0],[-1,0],[0,1],[0,-1]];
  while(list.length){
    const idx = rnd()<p ? Math.floor(rnd()*list.length) : list.length-1;
    const [cx,cy] = list[idx], opts = [];
    for(const [dx,dy] of D){
      const nx=cx+dx, ny=cy+dy;
      if(nx>=0&&ny>=0&&nx<n&&ny<n&&g[2*ny+1][2*nx+1]===1) opts.push([dx,dy]);
    }
    if(!opts.length){ list.splice(idx,1); continue; }
    const [dx,dy] = opts[Math.floor(rnd()*opts.length)];
    g[2*cy+1+dy][2*cx+1+dx] = 0; g[2*(cy+dy)+1][2*(cx+dx)+1] = 0;
    list.push([cx+dx,cy+dy]);
  }
  g[1][0] = 0; g[S-2][S-1] = 0;                  // entrance (left) and exit (right)
  let ends = 0;                                   // dead ends = floor tiles with a single open neighbour
  for(let y=0;y<S;y++) for(let x=0;x<S;x++){
    if(g[y][x]) continue;
    let c=0; for(const [dx,dy] of D){ const a=x+dx,b=y+dy; if(a>=0&&b>=0&&a<S&&b<S&&!g[b][a]) c++; }
    if(c===1) ends++;
  }
  return {g, S, start:[0,1], exit:[S-1,S-2], deadEnds: ends-2};   // minus entrance and exit
}

const D4 = [[1,0],[-1,0],[0,1],[0,-1]];
function solve(m){                               // distance-to-exit map + the entrance→exit route
  const {g,S} = m, dist = new Int32Array(S*S).fill(-1), q = [m.exit];
  dist[m.exit[1]*S+m.exit[0]] = 0;
  for(let i=0;i<q.length;i++){
    const [x,y] = q[i];
    for(const [dx,dy] of D4){ const a=x+dx,b=y+dy;
      if(a<0||b<0||a>=S||b>=S||g[b][a]||dist[b*S+a]>=0) continue;
      dist[b*S+a] = dist[y*S+x]+1; q.push([a,b]); }
  }
  const route = new Set(); let [x,y] = m.start; route.add(y*S+x);
  while(dist[y*S+x]>0){
    for(const [dx,dy] of D4){ const a=x+dx,b=y+dy;
      if(a>=0&&b>=0&&a<S&&b<S&&dist[b*S+a]===dist[y*S+x]-1){ x=a; y=b; route.add(y*S+x); break; } }
  }
  return {route, dist};
}

// ---------- Game state ----------
let M, route, showRoute=false, px, py, fx, fy, ax, ay, moving, t0, startT, won, curSeed, curN, curLevel, dist, mv, steps, wall, compass, targeting, qOpen, qAnswered, qCur, qEnd, qLimit, qStats, riskMul=1, view={V:1,camX:0,camY:0,T:1};
const DUR = 140;
const cv = $('cv'), ctx = cv.getContext('2d');

function newMaze(n, seed, level){
  curN = n; curSeed = seed; curLevel = level;
  M = generate(n, seed, level); ({route, dist} = solve(M));
  [px,py] = M.start; fx=ax=px; fy=ay=py; moving=false; startT=0; won=false;
  mv=CFG.start; steps=0; wall=0; compass=0; targeting=false; qOpen=false; qStats={ok:0,n:0};
  $('win').classList.remove('show'); $('quiz').classList.remove('show'); refresh();
  $('time').textContent = '0:00'; $('seedShow').textContent = seed;
  $('info').textContent = `${LEVELS[level].name} · ${n}×${n} rooms (${M.S}×${M.S} tiles) · ${M.deadEnds} dead ends · same level + size + seed = same maze.`;
  resize();
}

function setLevelUI(){
  const L = LEVELS[$('level').value];
  $('n').min = L.min; $('n').value = L.def;
  $('nLbl').textContent = `Map size N (N×N rooms, ${L.min}–40)`;
}

// Returns [n, seed, level] or null (with an error message) when settings are invalid
function readSettings(){
  const level = $('level').value, L = LEVELS[level];
  const n = Number($('n').value), seedRaw = $('seed').value.trim(), seed = Number(seedRaw);
  let err = '';
  if(!Number.isInteger(n) || n<L.min || n>40) err = `${L.name} needs a map size N between ${L.min} and 40.`;
  else if(!/^\d{5}$/.test(seedRaw) || seed<10000) err = 'Seed must be a 5-digit number (10000–99999).';
  $('err').textContent = err;
  return err ? null : [n, seed, level];
}
const start = () => { const s = readSettings(); if(s) newMaze(...s); };
$('gen').onclick = start;
$('level').onchange = () => { setLevelUI(); start(); };
$('rnd').onclick = () => { $('seed').value = 10000 + Math.floor(Math.random()*90000); start(); };
$('again').onclick = $('rnd').onclick;
$('replay').onclick = () => newMaze(curN, curSeed, curLevel);
$('route').onclick = () => { showRoute = !showRoute; $('route').textContent = showRoute ? 'Hide route' : 'Show route'; };
$('seed').onkeydown = $('n').onkeydown = e => { if(e.key==='Enter') $('gen').click(); };

// ---------- Input ----------
const held = [];
const KEYS = {ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
const VEC = {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
addEventListener('keydown', e => {
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Escape' && targeting){ targeting=false; status('Teleport cancelled.'); return; }
  if(qOpen){ const i = '1234'.indexOf(e.key); if(i>=0 && $('qOpts').children[i]) $('qOpts').children[i].click(); return; }
  const d = KEYS[e.code]; if(!d) return;
  e.preventDefault();
  if(!held.includes(d)) held.push(d);
});
addEventListener('keyup', e => { const d=KEYS[e.code]; if(d){ const i=held.indexOf(d); if(i>=0) held.splice(i,1); } });
addEventListener('blur', () => held.length = 0);
document.querySelectorAll('.pad button').forEach(b => {
  const d = b.dataset.d;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if(!held.includes(d)) held.push(d); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => { const i=held.indexOf(d); if(i>=0) held.splice(i,1); }));
});

// ---------- Economy: moves, questions, risk, tools ----------
const CFG = {start:10, reward:3, qTime:20, wall:6, tele:10, teleR:5, compass:{10:4, 20:7, 30:10}};
const QUESTIONS = [
  {q:'What is the capital of Uzbekistan?', a:['Tashkent','Samarkand','Bukhara','Khiva'], c:0},
  {q:'Which city is famous for the Registan square?', a:['Samarkand','Tashkent','Andijan','Nukus'], c:0},
  {q:'Which Central Asian sea has nearly disappeared?', a:['Aral Sea','Caspian Sea','Black Sea','Dead Sea'], c:0},
  {q:'What is the capital of Kazakhstan?', a:['Astana','Almaty','Bishkek','Dushanbe'], c:0},
  {q:'Which mountains cover much of Tajikistan?', a:['Pamir','Alps','Andes','Urals'], c:0},
  {q:'Which lake is the largest in Kyrgyzstan?', a:['Issyk-Kul','Baikal','Balkhash','Sarez'], c:0},
  {q:'Which ruler made Samarkand his capital in the 14th century?', a:['Amir Timur','Genghis Khan','Babur','Ulugh Beg'], c:0},
  {q:'The Silk Road linked China with…', a:['The Mediterranean','Australia','Brazil','Canada'], c:0},
  {q:'7 × 8 = ?', a:['56','54','48','64'], c:0},
  {q:'What is the square root of 144?', a:['12','14','11','16'], c:0},
  {q:'Which planet is called the Red Planet?', a:['Mars','Venus','Jupiter','Mercury'], c:0},
  {q:'What is the chemical formula of water?', a:['H₂O','CO₂','O₂','NaCl'], c:0}
];
let bag = [];
const nextQ = () => { if(!bag.length) bag = QUESTIONS.slice().sort(()=>Math.random()-.5); return bag.pop(); };
const status = s => $('status').textContent = s;

function refresh(){
  $('moves').textContent = mv;
  const set = (id, label, cost, extra) => { const b=$(id); b.textContent = `${label} · ${cost}`; b.disabled = mv<cost || qOpen || won; };
  set('bWall','🧱 Wall pass',CFG.wall); set('bTele',`🌀 Teleport (r${CFG.teleR})`,CFG.tele);
  for(const n of [10,20,30]) set('bC'+n,`🧭 Compass ${n}`,CFG.compass[n]);
  $('bTele').disabled = (mv<CFG.tele && !targeting) || qOpen || won;
  $('stat2').textContent = `Wall passes: ${wall} · Compass: ${compass} steps · Quiz: ${qStats.ok}/${qStats.n} correct · Steps: ${steps}`;
}

function openQ(){
  if(qOpen || won || !M) return;
  held.length = 0; targeting = false; qOpen = true; qAnswered = false;
  const q = nextQ(), o = q.a.map((text,i)=>({text,i})).sort(()=>Math.random()-.5);
  qCur = q; qLimit = CFG.qTime/riskMul*1000; qEnd = performance.now()+qLimit;
  if(!startT) startT = performance.now();
  $('qText').textContent = q.q;
  $('qInfo').textContent = riskMul>1 ? `⚡ Risk ×${riskMul}: ${CFG.qTime/riskMul}s · reward +${CFG.reward*riskMul} moves` : `${CFG.qTime}s · reward +${CFG.reward} moves`;
  $('qOpts').innerHTML = '';
  o.forEach((x,k) => { const b=document.createElement('button'); b.textContent=`${k+1}. ${x.text}`; b.dataset.i=x.i; b.onclick=()=>answer(x.i); $('qOpts').appendChild(b); });
  $('qBar').style.width = '100%';
  $('quiz').classList.add('show'); refresh();
}
function answer(i){
  if(!qOpen || qAnswered) return;
  qAnswered = true; qStats.n++;
  const ok = i===qCur.c, gain = CFG.reward*riskMul;
  if(ok){ mv += gain; qStats.ok++; status(`Correct! +${gain} moves.`); } else status(i<0 ? "Time's up! No moves earned." : 'Wrong answer. No moves earned.');
  [...$('qOpts').children].forEach(b => { b.classList.toggle('ok', +b.dataset.i===qCur.c); if(+b.dataset.i===i && !ok) b.classList.add('bad'); });
  setTimeout(() => { qOpen=false; $('quiz').classList.remove('show'); refresh(); }, ok?700:1300);
  refresh();
}
$('qBtn').onclick = openQ;
document.querySelectorAll('#risk button').forEach(b => b.onclick = () => {
  riskMul = +b.dataset.r;
  document.querySelectorAll('#risk button').forEach(x => x.classList.toggle('on', x===b));
  status(riskMul>1 ? `Risk ×${riskMul}: questions get ${CFG.qTime/riskMul}s and pay +${CFG.reward*riskMul} moves.` : 'Risk off: normal time, +'+CFG.reward+' moves.');
});
function buy(cost, fn){ if(qOpen||won||mv<cost) return; mv-=cost; fn(); refresh(); }
$('bWall').onclick = () => buy(CFG.wall, () => { wall++; status('Wall pass ready: walk into a wall to jump over it.'); });
for(const n of [10,20,30]) $('bC'+n).onclick = () => buy(CFG.compass[n], () => { compass+=n; status(`Compass active for ${n} steps: the gold arrow points the way.`); });
$('bTele').onclick = () => {
  if(targeting){ targeting=false; status('Teleport cancelled.'); return; }
  if(mv<CFG.tele||qOpen||moving||won) return;
  targeting = true; status(`Teleport: tap a highlighted tile within ${CFG.teleR} tiles (cost ${CFG.tele}). Esc cancels.`); refresh();
};
cv.addEventListener('pointerdown', e => {
  if(!targeting||qOpen||moving||won) return;
  const r = cv.getBoundingClientRect(), T = r.width/view.V;
  const x = Math.floor((e.clientX-r.left)/T+view.camX), y = Math.floor((e.clientY-r.top)/T+view.camY);
  if(x<0||y<0||x>=M.S||y>=M.S||M.g[y][x]||(x===px&&y===py)||Math.hypot(x-px,y-py)>CFG.teleR) return;
  mv -= CFG.tele; targeting = false; fx=px; fy=py; px=x; py=y; moving=true; t0=performance.now();
  if(!startT) startT = t0;
  status('Teleported!'); refresh();
});

function tryMove(d, now){
  const [dx,dy] = VEC[d];
  let nx=px+dx, ny=py+dy, hop=false;
  if(nx<0||ny<0||nx>=M.S||ny>=M.S) return;
  if(M.g[ny][nx]){                               // wall: needs a wall pass, and floor right behind it
    const bx=px+2*dx, by=py+2*dy;
    if(!wall || bx<0||by<0||bx>=M.S||by>=M.S||M.g[by][bx]) return;
    nx=bx; ny=by; hop=true;
  }
  if(mv<1){ status('Out of moves! Answer a question to earn more.'); openQ(); return; }
  if(!startT) startT = now;
  if(hop) wall--;
  if(compass>0) compass--;
  mv--; steps++;
  fx=px; fy=py; px=nx; py=ny; moving=true; t0=now;
  refresh();
}

// ---------- Rendering ----------
let cssW = 0, dpr = 1;
function resize(){
  const r = $('stage').getBoundingClientRect();
  cssW = r.width; dpr = window.devicePixelRatio || 1;
  cv.width = cv.height = Math.round(cssW*dpr);
}
addEventListener('resize', resize);

function draw(now){
  const S = M.S, V = Math.min(S, 15), T = cssW / V;
  const camX = Math.max(0, Math.min(S-V, ax+.5-V/2)), camY = Math.max(0, Math.min(S-V, ay+.5-V/2));
  view = {V,camX,camY,T};
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingQuality = 'high';
  ctx.clearRect(0,0,cssW,cssW);
  const x0=Math.floor(camX), y0=Math.floor(camY), x1=Math.min(S-1,Math.ceil(camX+V)), y1=Math.min(S-1,Math.ceil(camY+V));
  const sz = Math.ceil(T)+1;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    const sx = Math.round((x-camX)*T), sy = Math.round((y-camY)*T);
    ctx.drawImage(M.g[y][x] ? wallImg : floorImg, sx, sy, sz, sz);
  }
  // route hint
  if(showRoute){
    ctx.fillStyle = 'rgba(255,230,140,.75)';
    route.forEach(k => { const x=k%S, y=Math.floor(k/S);
      ctx.beginPath(); ctx.arc((x+.5-camX)*T,(y+.5-camY)*T,T*.1,0,7); ctx.fill(); });
  }
  const pl = .5+.5*Math.sin(now/300);
  if(targeting){                                  // teleport range
    ctx.fillStyle = 'rgba(80,220,255,.28)';
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      if(M.g[y][x]||(x===px&&y===py)||Math.hypot(x-px,y-py)>CFG.teleR) continue;
      ctx.fillRect(Math.round((x-camX)*T), Math.round((y-camY)*T), sz, sz);
    }
    ctx.strokeStyle='rgba(120,230,255,.9)'; ctx.lineWidth=2; ctx.beginPath();
    ctx.arc((px+.5-camX)*T,(py+.5-camY)*T,CFG.teleR*T,0,7); ctx.stroke();
  }
  if(compass>0 && !won){                          // direction shower: arrow toward the exit
    const d0 = dist[py*S+px];
    for(const [dx,dy] of D4){
      const a=px+dx, b=py+dy;
      if(a<0||b<0||a>=S||b>=S||M.g[b][a]||dist[b*S+a]!==d0-1) continue;
      ctx.save(); ctx.translate((a+.5-camX)*T,(b+.5-camY)*T); ctx.rotate(Math.atan2(dy,dx));
      ctx.fillStyle = `rgba(255,215,90,${.6+.4*pl})`;
      ctx.beginPath(); ctx.moveTo(T*.3,0); ctx.lineTo(-T*.2,-T*.22); ctx.lineTo(-T*.2,T*.22); ctx.closePath(); ctx.fill();
      ctx.restore(); break;
    }
  }
  // entrance + exit markers
  const pulse = .5+.5*Math.sin(now/300);
  const ex=(M.exit[0]+.5-camX)*T, ey=(M.exit[1]+.5-camY)*T;
  let gr = ctx.createRadialGradient(ex,ey,0,ex,ey,T*.75);
  gr.addColorStop(0,`rgba(255,215,90,${.65+.3*pulse})`); gr.addColorStop(1,'rgba(255,200,60,0)');
  ctx.fillStyle = gr; ctx.fillRect(ex-T,ey-T,T*2,T*2);
  ctx.fillStyle='#ffd65a'; ctx.font=`700 ${T*.5}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('★',ex,ey);
  // player: rounded square
  const cx=(ax+.5-camX)*T, cy=(ay+.5-camY)*T, s=T*.56;
  ctx.save();
  ctx.shadowColor='rgba(80,220,255,.9)'; ctx.shadowBlur=T*.35;
  const pg = ctx.createLinearGradient(cx-s/2,cy-s/2,cx+s/2,cy+s/2);
  pg.addColorStop(0,'#8cf0ff'); pg.addColorStop(1,'#1aa7d6');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.roundRect(cx-s/2,cy-s/2,s,s,s*.18); ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=Math.max(1,T*.04);
  ctx.beginPath(); ctx.roundRect(cx-s/2,cy-s/2,s,s,s*.18); ctx.stroke();
  // torchlight (dims everything away from the player)
  if($('dim').checked){
    const dg = ctx.createRadialGradient(cx,cy,T*2.5,cx,cy,T*Math.max(V*.62,4));
    dg.addColorStop(0,'rgba(0,0,0,0)'); dg.addColorStop(1,'rgba(0,0,0,.62)');
    ctx.fillStyle = dg; ctx.fillRect(0,0,cssW,cssW);
  }
}

function fmt(ms){ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function frame(now){
  if(M){
    if(qOpen && !qAnswered){
      const left = qEnd-now;
      $('qBar').style.width = Math.max(0,left/qLimit*100)+'%';
      if(left<=0) answer(-1);
    }
    if(moving){
      const k = Math.min(1,Math.max(0,(now-t0)/DUR)), e = 1-Math.pow(1-k,2);   // ease-out
      ax = fx+(px-fx)*e; ay = fy+(py-fy)*e;
      if(k>=1){
        moving=false; ax=px; ay=py;
        if(px===M.exit[0] && py===M.exit[1]){
          won=true; held.length=0;
          $('winTxt').textContent = `${steps} steps · ${fmt(now-startT)} · quiz ${qStats.ok}/${qStats.n} · ${LEVELS[curLevel].name} ${curN}×${curN} · seed ${curSeed}`;
          refresh();
          $('win').classList.add('show');
        }
      }
    }
    if(!moving && !won && held.length) tryMove(held[held.length-1], now);
    if(startT && !won) $('time').textContent = fmt(now-startT);
    if(wallImg.complete && floorImg.complete) draw(now);
  }
  requestAnimationFrame(frame);
}
setLevelUI();
start();
requestAnimationFrame(frame);
</script>
</body>
</html>
